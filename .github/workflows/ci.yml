name: Build and Test

on: [push, pull_request]

env:
  # The V revision CI builds. Pinned rather than taken from master, because V
  # master broke its own bootstrap on 2026-10-02 in 233f259a7a, which added
  # C.S_IFMT to vlib/os/os_stat_windows.c.v - a constant the bundled tcc does not
  # define on Windows. Every job here was red for ten days as a result, with no
  # change on this side.
  #
  # 532f63b6d2 is the parent of that commit and builds. To move it forward, bump
  # this and check all four jobs; the bump-v workflow does that automatically and
  # opens a PR when a newer V is green, so this does not silently go stale.
  V_REF: 532f63b6d2369708e62dd9e8b77e987dedac5152

jobs:
  winos-test:
    runs-on: windows-latest
    env:
      VFLAGS: -cc tcc
      VJOBS: 1
      VTEST_SHOW_START: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: coreutils
      - name: Checkout V
        uses: actions/checkout@v6
        with:
          repository: vlang/v
          ref: ${{ env.V_REF }}
          path: v
      - name: Build V
        shell: bash
        run: |
          # Build V
          cd v && ./makev.bat -tcc
          echo "adding '${PWD}' to PATH"
          echo "${PWD}" >> $GITHUB_PATH
      - name: Download uutils/coreutils
        uses: engineerd/configurator@v0.0.10 
        with:
          name: 'coreutils.exe'
          url: 'https://github.com/uutils/coreutils/releases/download/0.0.17/coreutils-0.0.17-x86_64-pc-windows-msvc.zip'
          pathInArchive: 'coreutils-0.0.17-x86_64-pc-windows-msvc/coreutils.exe'
      - name: V doctor
        shell: bash
        run: |
          # V doctor
          v doctor
      - name: Info
        shell: bash
        run: |
          ## Info
          # environment
          echo "## environment"
          echo "CI='${CI}'"
          # tooling info display
          echo "## testing/tooling"
          coreutils
          which tcc >/dev/null 2>&1 && (tcc --version | head -1) || true
          v --version
      - name: Build all
        shell: bash
        run: |
          # Build all
          cd coreutils && v build.vsh
      - name: Run tests
        shell: bash
        run: |
          # Run tests
          cd coreutils && USE_MULTI_BINARY_TO_TEST=coreutils v test .

  ubuntu-fast-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V
        uses: actions/checkout@v6
        with:
          repository: vlang/v
          ref: ${{ env.V_REF }}
          path: v
      - name: Build V
        run: cd v && make && sudo ./v symlink && cd -
      - name: Checkout Coreutils (for tests)
        uses: actions/checkout@v6
        with:
          path: coreutils
      - name: V doctor
        run: v doctor
      - name: Ensure everything is formatted
        run: cd coreutils && make testfmt
      - name: Build all
        run: cd coreutils && v run build.vsh
      - name: Debug uptime_nix_test.v
        run: cd coreutils && v -d trace_same_results -stats src/uptime/uptime_nix_test.v
      - name: Run tests
        run: cd coreutils && make test

  ubuntu-prod-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V
        uses: actions/checkout@v6
        with:
          repository: vlang/v
          ref: ${{ env.V_REF }}
          path: v
      - name: Build V
        run: cd v && make && sudo ./v symlink && cd -
      - name: Checkout Coreutils (for tests)
        uses: actions/checkout@v6
        with:
          path: coreutils
      - name: Build all with -prod
        run: cd coreutils && v run build.vsh -prod
      - name: Run tests
        run: cd coreutils && make test

  ubuntu-gnu-coreutils:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V
        uses: actions/checkout@v6
        with:
          repository: vlang/v
          ref: ${{ env.V_REF }}
          path: v
      - name: Build V
        run: cd v && make && sudo ./v symlink && cd -
      - name: Checkout Coreutils (for tests)
        uses: actions/checkout@v4
        with:
          path: coreutils
      - name: Build all
        run: cd coreutils && v run build.vsh
      - name: Native utils diagnostics (before GNU coreutils)
        run: |
          echo "::remove-matcher owner=v-problem-matcher::"
          sleep --version
          uptime --version
      - name: Setup the original GNU coreutils for comparison
        uses: ShenTengTu/setup-gnu-coreutils-action@v1
      - name: Test GNU coreutils uptime
        run: uptime --version
      - name: Run tests
        run: cd coreutils && GNU_COREUTILS_INSTALLED=1 make test
