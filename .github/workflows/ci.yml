name: Build and Test

on: [push, pull_request]

jobs:
  winos-test:
    runs-on: windows-latest
    env:
      VFLAGS: -cc tcc
      VJOBS: 1
      VTEST_SHOW_START: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: coreutils
      - name: Checkout Latest V
        uses: actions/checkout@v6
        with:
          repository: vlang/v
          path: v
      - name: Build V
        shell: bash
        run: |
          # Build V
          cd v && ./makev.bat -tcc
          echo "adding '${PWD}' to PATH"
          echo "${PWD}" >> $GITHUB_PATH
      - name: Download uutils/coreutils
        uses: engineerd/configurator@v0.0.10 
        with:
          name: 'coreutils.exe'
          url: 'https://github.com/uutils/coreutils/releases/download/0.0.17/coreutils-0.0.17-x86_64-pc-windows-msvc.zip'
          pathInArchive: 'coreutils-0.0.17-x86_64-pc-windows-msvc/coreutils.exe'
      - name: V doctor
        shell: bash
        run: |
          # V doctor
          v doctor
      - name: Info
        shell: bash
        run: |
          ## Info
          # environment
          echo "## environment"
          echo "CI='${CI}'"
          # tooling info display
          echo "## testing/tooling"
          coreutils
          which tcc >/dev/null 2>&1 && (tcc --version | head -1) || true
          v --version
      - name: Build all
        shell: bash
        run: |
          # Build all
          cd coreutils && v build.vsh
      - name: Run tests
        shell: bash
        run: |
          # Run tests
          cd coreutils && USE_MULTI_BINARY_TO_TEST=coreutils v test .

  ubuntu-fast-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Latest V
        uses: actions/checkout@v6
        with:
          repository: vlang/v
          path: v
      - name: Build V
        run: cd v && make && sudo ./v symlink && cd -
      - name: Checkout Coreutils (for tests)
        uses: actions/checkout@v6
        with:
          path: coreutils
      - name: V doctor
        run: v doctor
      - name: Ensure everything is formatted
        run: cd coreutils && make testfmt
      - name: Build all
        run: cd coreutils && v run build.vsh
      - name: Debug uptime_nix_test.v
        run: cd coreutils && v -d trace_same_results -stats src/uptime/uptime_nix_test.v
      - name: Run tests
        run: cd coreutils && make test

  ubuntu-prod-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Latest V
        uses: actions/checkout@v6
        with:
          repository: vlang/v
          path: v
      - name: Build V
        run: cd v && make && sudo ./v symlink && cd -
      - name: Checkout Coreutils (for tests)
        uses: actions/checkout@v6
        with:
          path: coreutils
      - name: Build all with -prod
        run: cd coreutils && v run build.vsh -prod
      - name: Run tests
        run: cd coreutils && make test

  ubuntu-gnu-coreutils:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Latest V
        uses: actions/checkout@v6
        with:
          repository: vlang/v
          path: v
      - name: Build V
        run: cd v && make && sudo ./v symlink && cd -
      - name: Checkout Coreutils (for tests)
        uses: actions/checkout@v4
        with:
          path: coreutils
      - name: Build all
        run: cd coreutils && v run build.vsh
      - name: Native utils diagnostics (before GNU coreutils)
        run: |
          echo "::remove-matcher owner=v-problem-matcher::"
          sleep --version
          uptime --version
      - name: Setup the original GNU coreutils for comparison
        uses: ShenTengTu/setup-gnu-coreutils-action@v1
      - name: Test GNU coreutils uptime
        run: uptime --version
      - name: Run tests
        run: cd coreutils && GNU_COREUTILS_INSTALLED=1 make test

  # Run GNU's own test suite against our binaries. This is a different
  # measurement from `make test`: make test runs the unit tests this repo
  # wrote, while this runs the tests GNU writes for its own implementation,
  # against ours. The number it produces is the pass rate of the real suite.
  #
  # It fetches the GNU release tarball rather than the git sources, because the
  # tarball ships its configure and tests/ pre-generated, and the only workaround
  # the build needs is copying lib/stdckdint.in.h into place. See the comment at
  # the top of util/gnu_test_suite.vsh.
  ubuntu-gnu-test-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Latest V
        uses: actions/checkout@v6
        with:
          repository: vlang/v
          path: v
      - name: Build V
        run: cd v && make && sudo ./v symlink && cd -
      - name: Checkout Coreutils
        uses: actions/checkout@v6
        with:
          path: coreutils
      - name: V doctor
        run: v doctor
      - name: Build all our tools
        run: cd coreutils && v run build.vsh
      - name: Cache the GNU test suite build
        uses: actions/cache@v4
        with:
          path: coreutils/.gnu
          key: gnu-suite-${{ runner.os }}-${{ hashFiles('util/gnu_test_suite.vsh') }}
      - name: Run the GNU coreutils test suite against our binaries
        run: |
          cd coreutils
          v run util/gnu_test_suite.vsh --bin-dir bin --jobs $(nproc)
          status=$?
          if [ $status -ne 0 ]; then
            echo "::warning::the GNU suite reported failing tests; see the log below"
          fi
          exit 0
      - name: Upload the full suite log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gnu-test-suite-log
          path: |
            coreutils/.gnu/coreutils-9.4/tests/test-suite.log
            coreutils/.gnu/coreutils-9.4/check.log
          if-no-files-found: warn
